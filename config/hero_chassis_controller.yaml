controller:
  hero_chassis_controller:
    type: hero_chassis_controller/HeroChassisController

    #test_mode: true
    world_frame_mode: false     # false=底盘坐标系(选做5)  true=世界坐标系(选做7)

    wheel_radius: 0.07625
    wheel_base: 0.4           #从URDF里面来
    wheel_track: 0.4

    front_left_wheel:
      p: 2.0
      i: 0.2
      d: 0.0
      #i_clamp:10.0   不能用这个，因为装的版本没有
      i_clamp_max: 1.0
      i_clamp_min: -1.0

    front_right_wheel:
      p: 2.0
      i: 0.2
      d: 0.0
      #i_clamp:10.0
      i_clamp_max: 1.0
      i_clamp_min: -1.0

    back_left_wheel:
      p: 2.0
      i: 0.2
      d: 0.0
      i_clamp_max: 1.0
      i_clamp_min: -1.0

    back_right_wheel:
      p: 2.0
      i: 0.2
      d: 0.0
      i_clamp_max: 1.0
      i_clamp_min: -1.0

  joint_state_controller:           # 广播器，发布机器人所有关节的当前状态
    type: joint_state_controller/JointStateController
    publish_rate: 50                # 每秒发布50次关节状态